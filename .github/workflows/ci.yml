name: CI

on:
  push:
    branches: [ "main", "feature/**", "[0-9]*-**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  launcher-diagnostics:
    name: Launcher diagnostics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test launcher without external services
        run: python -m unittest discover -s tests -p test_run_demo.py -v

  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint check
        run: |
          ruff check .

      - name: Run Ruff format check
        run: |
          ruff format --check .

      - name: Run mypy type check
        run: |
          mypy src tests

      - name: Run pytest with coverage
        run: |
          pytest

      - name: Build wheel and source distribution
        run: |
          python -m build

      - name: Validate Kubernetes Manifests
        run: |
          kubectl kustomize deploy/kubernetes/base
          kubectl kustomize deploy/kubernetes/overlays/local

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Validate Helm Chart
        run: |
          helm lint charts/open-healthcare
          helm template open-healthcare charts/open-healthcare > /dev/null
          helm package charts/open-healthcare -d /tmp/chart-pkg
          test -f /tmp/chart-pkg/open-healthcare-*.tgz

      - name: Verify package installation and import
        run: |
          python -m pip install dist/*.whl
          healthcare-agents --version
          healthcare-agents health
          python -c "import healthcare_agents; print('Imported version:', healthcare_agents.__version__)"
